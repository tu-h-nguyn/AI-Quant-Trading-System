data:
  symbols: ["SPY", "QQQ", "IWM", "TLT", "GLD"]
  start: "2015-01-01"
  end: null
  interval: "1d"
backtest:
  transaction_cost_bps: 5
  initial_capital: 100000
features:
  return_windows: [1, 5, 20]
  volatility_windows: [5, 20]
  moving_average_fast: 20
  moving_average_slow: 50
model:
  horizon: 5
  test_size: 0.2
  threshold: 0.5
  random_state: 42
portfolio:
  max_weight: 0.40
  method: "min_variance"
risk:
  target_volatility: 0.10
  max_leverage: 1.50
  volatility_window: 20
  max_drawdown: 0.20
research:
  portfolio_lookback: 252
  rebalance_every: 21
  benchmark: "SPY"
  walk_forward_test_window: 63
  walk_forward_min_train_size: 504
  walk_forward_gap: 5
  time_series_splits: 5
  bootstrap_samples: 2000
  bootstrap_block: 20
