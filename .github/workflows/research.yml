name: Research Reproducibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "configs/**"
      - "scripts/**"
      - "src/**"
      - ".github/workflows/research.yml"

permissions:
  contents: write

jobs:
  research:
    if: "!contains(github.event.head_commit.message, '[skip research]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download market data
        run: python scripts/download_data.py

      - name: Run V5 research report
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: python scripts/run_v5_report.py

      - name: Run multi-asset research
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: python scripts/run_research.py

      - name: Publish research artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/v5_research_report.md reports/experiments/v5_model_diagnostics.json
          git add -f reports/figures/v5_equity_curve.png reports/figures/v5_drawdown.png reports/figures/v5_turnover.png reports/figures/v5_rolling_sharpe.png reports/figures/v5_calibration.png reports/figures/v5_feature_importance.png
          if git diff --cached --quiet; then
            echo "No research artifact changes to publish."
          else
            git commit -m "chore: publish reproducible V5 research artifacts [skip ci] [skip research]"
            git push
          fi

      - name: Upload experiment bundle
        uses: actions/upload-artifact@v4
        with:
          name: quant-research-v5
          path: |
            reports/v5_research_report.md
            reports/experiments/v5_model_diagnostics.json
            reports/figures/*.png
