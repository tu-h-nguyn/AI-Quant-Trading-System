name: Research Reproducibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "configs/**"
      - "scripts/**"
      - "src/**"
      - ".github/workflows/research.yml"

permissions:
  contents: write

jobs:
  research:
    if: "!contains(github.event.head_commit.message, '[skip research]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download market data
        run: python scripts/download_data.py

      - name: Run flagship OOS study
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: python scripts/run_flagship_study.py

      - name: Run V5 diagnostics report
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: python scripts/run_v5_report.py

      - name: Run rolling portfolio research
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: python scripts/run_research.py

      # Runs without network access: with no cached panel the study falls back
      # to synthetic markets, which is what makes it reproducible in CI.
      - name: Run Polymarket OOS study
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: python scripts/run_polymarket_study.py

      - name: Self-test the arbitrage scanner against planted mispricings
        run: python scripts/scan_polymarket_arbitrage.py --source simulation

      - name: Run tests and lint
        run: |
          pytest
          ruff check src scripts

      - name: Publish research artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/flagship_research_report.md reports/flagship_results.csv reports/flagship_aggregate_results.csv
          git add reports/experiments/*.json
          git add reports/v5_research_report.md
          git add reports/polymarket_research_report.md reports/polymarket_results.csv
          git add reports/polymarket_arbitrage.csv reports/polymarket_market_making.csv reports/polymarket_capital_velocity.csv reports/polymarket_resolution_risk.csv
          git add -f reports/figures/*.png
          if git diff --cached --quiet; then
            echo "No research artifact changes to publish."
          else
            git commit -m "chore: publish reproducible research artifacts [skip ci] [skip research]"
            git push
          fi

      - name: Upload full research bundle
        uses: actions/upload-artifact@v4
        with:
          name: quant-research-flagship
          path: |
            reports/flagship_research_report.md
            reports/flagship_results.csv
            reports/flagship_aggregate_results.csv
            reports/experiments/*.json
            reports/v5_research_report.md
            reports/polymarket_research_report.md
            reports/polymarket_results.csv
            reports/polymarket_arbitrage.csv
            reports/polymarket_market_making.csv
            reports/polymarket_capital_velocity.csv
            reports/polymarket_resolution_risk.csv
            reports/figures/*.png
